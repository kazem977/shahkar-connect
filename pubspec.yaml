name: shahkar_connect
description: Shahkar native client for iOS, Android, Windows, macOS, and Linux.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  intl: ">=0.19.0 <0.21.0"
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# 9.6.1 (2026-09-15) references Architecture.arm64e, which published
# code_assets 2.0.0 does not have. That breaks `flutter test` on Linux CI
# because google_fonts → path_provider → path_provider_foundation pulls it in.
dependency_overrides:
  objective_c: 9.6.0

flutter:
  uses-material-design: true
  generate: false
