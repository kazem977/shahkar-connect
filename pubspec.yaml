name: shahkar_connect
description: vpnai client for iOS, Android, Windows, macOS, and Linux.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  in_app_purchase: ^3.2.0
  intl: any
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  window_manager: ^0.4.3
  flutter_screenutil: ^5.9.3
  getwidget: ^7.0.2
  shadcn_ui: ^0.56.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: false
  assets:
    - assets/brand/vpnai-mark.png
    - assets/brand/world-map-dots.png
    - assets/brand/world-map-fine.png
    - assets/brand/world-map-bg.jpg
    - assets/flags/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
